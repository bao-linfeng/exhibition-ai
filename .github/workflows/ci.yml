name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Container verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_NAME: exhibition-ci-${{ github.run_id }}
      COMPOSE_FILE: infra/compose.dev.yaml
      PGHOST: postgres
      PGDATABASE: exhibition
      PGUSER: exhibition
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      S3_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: http://localhost:19000
      API_INTERNAL_URL: http://api:3000
      WEB_ORIGIN: http://localhost:5173
      S3_REGION: us-east-1
      S3_BUCKET: exhibition
      SESSION_SECRET: ci-session-secret-not-for-production
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: info
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment
        env:
          CI_PGPASSWORD: ${{ secrets.PGPASSWORD }}
          CI_REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          CI_S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          CI_S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          PGPASSWORD="${CI_PGPASSWORD:-$(openssl rand -hex 16)}"
          REDIS_PASSWORD="${CI_REDIS_PASSWORD:-$(openssl rand -hex 16)}"
          S3_ACCESS_KEY="${CI_S3_ACCESS_KEY:-$(openssl rand -hex 16)}"
          S3_SECRET_KEY="${CI_S3_SECRET_KEY:-$(openssl rand -hex 16)}"
          {
            printf 'PGHOST=%s\n' "$PGHOST"
            printf 'PGDATABASE=%s\n' "$PGDATABASE"
            printf 'PGUSER=%s\n' "$PGUSER"
            printf 'PGPASSWORD=%s\n' "$PGPASSWORD"
            printf 'REDIS_HOST=%s\n' "$REDIS_HOST"
            printf 'REDIS_PORT=%s\n' "$REDIS_PORT"
            printf 'REDIS_PASSWORD=%s\n' "$REDIS_PASSWORD"
            printf 'S3_ENDPOINT=%s\n' "$S3_ENDPOINT"
            printf 'S3_PUBLIC_ENDPOINT=%s\n' "$S3_PUBLIC_ENDPOINT"
            printf 'S3_ACCESS_KEY=%s\n' "$S3_ACCESS_KEY"
            printf 'S3_SECRET_KEY=%s\n' "$S3_SECRET_KEY"
            printf 'S3_REGION=%s\n' "$S3_REGION"
            printf 'S3_BUCKET=%s\n' "$S3_BUCKET"
            printf 'API_INTERNAL_URL=%s\n' "$API_INTERNAL_URL"
            printf 'WEB_ORIGIN=%s\n' "$WEB_ORIGIN"
            printf 'SESSION_SECRET=%s\n' "$SESSION_SECRET"
            printf 'CORS_ORIGINS=%s\n' "$CORS_ORIGINS"
            printf 'LOG_LEVEL=%s\n' "$LOG_LEVEL"
            printf 'NODE_ENV=%s\n' "$NODE_ENV"
          } > .env

      - name: Build devtools image
        run: docker compose -p "$PROJECT_NAME" --env-file .env -f "$COMPOSE_FILE" --profile tools build devtools

      - name: Start infrastructure
        run: docker compose -p "$PROJECT_NAME" --env-file .env -f "$COMPOSE_FILE" up -d --wait postgres redis rustfs

      - name: Install dependencies
        run: docker compose -p "$PROJECT_NAME" --env-file .env -f "$COMPOSE_FILE" --profile tools run --rm devtools pnpm install --frozen-lockfile

      - name: Run migrations
        run: docker compose -p "$PROJECT_NAME" --env-file .env -f "$COMPOSE_FILE" --profile tools run --rm migrate

      - name: Initialize storage
        run: docker compose -p "$PROJECT_NAME" --env-file .env -f "$COMPOSE_FILE" --profile tools run --rm storage-init

      - name: Run checks
        run: docker compose -p "$PROJECT_NAME" --env-file .env -f "$COMPOSE_FILE" --profile tools run --rm devtools pnpm check

      - name: Build packages
        run: docker compose -p "$PROJECT_NAME" --env-file .env -f "$COMPOSE_FILE" --profile tools run --rm devtools pnpm build

      - name: Start application services
        run: docker compose -p "$PROJECT_NAME" --env-file .env -f "$COMPOSE_FILE" up -d --wait api worker web

      - name: Run integration tests
        run: docker compose -p "$PROJECT_NAME" --env-file .env -f "$COMPOSE_FILE" --profile tools run --rm devtools pnpm test:integration

      - name: Collect service logs
        if: failure()
        run: docker compose -p "$PROJECT_NAME" --env-file .env -f "$COMPOSE_FILE" logs --tail 100

      - name: Clean up
        if: always()
        run: docker compose -p "$PROJECT_NAME" --env-file .env -f "$COMPOSE_FILE" down
