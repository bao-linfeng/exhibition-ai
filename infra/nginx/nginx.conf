user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # 上游服务
    upstream api_backend {
        server api:3000;
        keepalive 32;
    }

    upstream web_backend {
        server web:5173;
    }

    server {
        listen 80;
        server_name _;

        # 客户端请求体大小限制（用于资产上传）
        client_max_body_size 30M;

        # Web 应用（SPA）
        location / {
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # API 路由（非 SSE）
        location ~ ^/api/(?!v1/projects/[^/]+/events) {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 传递 Cookie 用于 Session 认证
            proxy_set_header Cookie $http_cookie;

            # 连接复用
            proxy_set_header Connection "";
        }

        # SSE 专用路由（关键配置）
        location ~ ^/api/v1/projects/[^/]+/events$ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            # SSE 必需配置：禁用缓冲
            proxy_buffering off;
            proxy_cache off;

            # 禁用 gzip 压缩（SSE 需要即时推送）
            gzip off;

            # 超时配置（SSE 长连接）
            proxy_read_timeout 3600s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 3600s;

            # 传递原始请求头
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;

            # SSE 响应头
            proxy_set_header Connection '';
            proxy_set_header Cache-Control 'no-cache';

            # 禁用 X-Accel-Buffering（Nginx 特有）
            proxy_set_header X-Accel-Buffering 'no';

            # 添加 CORS 头（如果需要跨域）
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials 'true' always;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Cookie, Last-Event-ID' always;

            # OPTIONS 预检请求
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # 健康检查
        location = /api/health {
            proxy_pass http://api_backend/api/health;
            access_log off;
        }

        location = /api/ready {
            proxy_pass http://api_backend/api/ready;
            access_log off;
        }
    }
}
