# 生产 nginx 配置
# TLS 证书由 1Panel 管理：
#   ssl_certificate      /etc/nginx/certs/your.domain.com.pem;
#   ssl_certificate_key  /etc/nginx/certs/your.domain.com.key;
# 1Panel 通常在 /www/server/panel/vhost/nginx/ 管理站点配置。
# 使用本文件时，将证书路径替换为实际路径并挂载到 nginx 容器中。

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    upstream api_backend {
        server api:3000;
        keepalive 32;
    }

    upstream web_backend {
        server web:80;
        keepalive 16;
    }

    server {
        listen 80;
        server_name your.domain.com;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name your.domain.com;

        # 由 1Panel 管理并挂载证书；按实际域名替换以下占位路径。
        ssl_certificate /etc/nginx/certs/your.domain.com.crt;
        ssl_certificate_key /etc/nginx/certs/your.domain.com.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        client_max_body_size 50M;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https:; frame-ancestors 'none';" always;

        # Web 应用（代理到 web 容器的预构建 SPA）
        location / {
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # API 路由（非 SSE）
        location ~ ^/api/(?!v1/projects/[^/]+/events) {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 传递 Cookie 用于 Session 认证
            proxy_set_header Cookie $http_cookie;

            # 连接复用
            proxy_set_header Connection "";
        }

        # SSE 专用路由（关键配置）
        location ~ ^/api/v1/projects/[^/]+/events$ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            # SSE 必需配置：禁用缓冲
            proxy_buffering off;
            proxy_cache off;

            # 禁用 gzip 压缩（SSE 需要即时推送）
            gzip off;

            # 超时配置（SSE 长连接）
            proxy_read_timeout 3600s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 3600s;

            # 传递原始请求头
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;

            proxy_set_header Connection '';

            # 同源部署，不需要 CORS 响应头或 OPTIONS 预检处理。
        }

        # 健康检查
        location = /api/health {
            proxy_pass http://api_backend/api/health;
            access_log off;
        }

        location = /api/ready {
            proxy_pass http://api_backend/api/ready;
            access_log off;
        }

        # 生产环境中，S3 签名 URL 应直接指向公网 S3_PUBLIC_ENDPOINT，nginx 无需代理 S3。
    }
}
