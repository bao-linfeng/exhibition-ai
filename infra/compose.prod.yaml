name: exhibition-ai

x-tooling: &tooling
  image: exhibition-ai-dev:local
  build:
    context: ..
    dockerfile: infra/docker/dev.Dockerfile
  working_dir: /workspace
  init: true
  env_file: ../.env
  environment:
    NODE_ENV: production
  volumes:
    - ..:/workspace
    - tooling_modules:/workspace/node_modules
  networks: [production]

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-exhibition}
      POSTGRES_USER: ${PGUSER:-exhibition}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [production]

  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      [
        sh,
        -c,
        'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"',
      ]
    volumes: [redis_data:/data]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [production]

  rustfs:
    image: rustfs/rustfs@sha256:97171b3d72cd47dc81000f92ea84de25608bfc35a94c965501afaeb5d99f6035
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_REGION: ${S3_REGION:-us-east-1}
    command: [rustfs, server, /data]
    volumes: [rustfs_data:/data]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:9000/health]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks: [production]

  migrate:
    <<: *tooling
    profiles: [tools]
    command: [pnpm, db:migrate]
    depends_on:
      postgres: { condition: service_healthy }

  storage-init:
    <<: *tooling
    profiles: [tools]
    command: [pnpm, storage:init]
    depends_on:
      rustfs: { condition: service_healthy }

  devtools:
    <<: *tooling
    profiles: [tools]
    command: [pnpm, check]

  api:
    image: ${REGISTRY:-ghcr.io/bao-linfeng}/exhibition-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ../.env
    environment:
      APP_ENV: production
      NODE_ENV: production
    command:
      - sh
      - -c
      - |
        if [ "$$AI_PROVIDER_MODE" = "mock" ]; then
          echo "ERROR: AI_PROVIDER_MODE=mock is not allowed in production" >&2
          exit 1
        fi
        exec node dist/server.js
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rustfs: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M }
        reservations: { cpus: '0.25', memory: 256M }
    networks: [production]

  worker:
    image: ${REGISTRY:-ghcr.io/bao-linfeng}/exhibition-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ../.env
    environment:
      APP_ENV: production
      NODE_ENV: production
    command:
      - sh
      - -c
      - |
        if [ "$$AI_PROVIDER_MODE" = "mock" ]; then
          echo "ERROR: AI_PROVIDER_MODE=mock is not allowed in production" >&2
          exit 1
        fi
        exec node dist/index.js
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rustfs: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const f=require('node:fs'),p=process.env.WORKER_HEALTH_FILE||'/tmp/exhibition-worker-health';try{process.exit(Date.now()-f.statSync(p).mtimeMs<30000?0:1)}catch{process.exit(1)}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: '2', memory: 1G }
        reservations: { cpus: '0.5', memory: 512M }
    networks: [production]

  web:
    image: ${REGISTRY:-ghcr.io/bao-linfeng}/exhibition-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: production
      NODE_ENV: production
    expose: ['80']
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, 'http://127.0.0.1:80/']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 64M }
    networks: [production]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, 'http://127.0.0.1:80/']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 128M }
    networks: [production]

networks:
  production:

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
  nginx_certs:
  nginx_logs:
  tooling_modules:
